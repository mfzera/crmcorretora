<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Inlined: prevents theme FOUC and eliminates a blocking network RTT -->
    <script>(function(){try{var s=localStorage.getItem('theme-storage');var t=s?JSON.parse(s).state?.theme:null;var dark=t==='dark'||(!t||t==='system')&&window.matchMedia('(prefers-color-scheme: dark)').matches;if(dark)document.documentElement.classList.add('dark');}catch(_){}})()</script>
    <title>Ecotech CRM - CRM Completo para Corretoras de Seguros</title>
    <meta name="description" content="Sistema CRM completo para corretoras de seguros. Gerencie cotações, propostas, renovações e sua equipe em um único lugar." />
    <link rel="icon" type="image/svg+xml" href="/logoecotech.svg" />
    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ecotech CRM" />
    <meta property="og:title" content="Ecotech CRM - CRM Completo para Corretoras de Seguros" />
    <meta property="og:description" content="Sistema CRM completo para corretoras de seguros. Gerencie cotações, propostas, renovações e sua equipe em um único lugar." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://ecotechts.com.br" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts -->
    <!-- Fonts served locally via @fontsource-variable — no external CDN request, no FOUC -->
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
