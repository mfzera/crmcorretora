name: Cloudflare Pages Deploy

# DESABILITADO: o deploy real do frontend é feito pela integração nativa
# Cloudflare Pages <-> Git. Este workflow falhava em todo push porque os secrets
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID estão vazios, deixando o CI
# permanentemente vermelho. Mantido apenas como disparo manual (workflow_dispatch);
# para reativar o deploy via Actions, configure os secrets e restaure o gatilho push.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install web dependencies only
        run: pnpm install --frozen-lockfile --filter @ecotech/web-new...

      - name: Build
        working-directory: apps/web-new
        run: pnpm run build
        env:
          CF_PAGES_BRANCH: ${{ github.ref_name }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web-new
        run: pnpm exec wrangler pages deploy dist/client --project-name=ecotech-sys --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
