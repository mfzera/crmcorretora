name: Railway Deploy Trigger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecotech
          POSTGRES_PASSWORD: ecotech
          POSTGRES_DB: ecotech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations against ephemeral Postgres
        env:
          DATABASE_URL: postgres://ecotech:ecotech@localhost:5432/ecotech_test
        run: pnpm tsx apps/api/scripts/run-migrations.ts

      - name: Check Drizzle schema consistency
        run: pnpm drizzle-kit check --config=drizzle.config.ts
        env:
          DATABASE_URL: postgres://ecotech:ecotech@localhost:5432/ecotech_test
        continue-on-error: true

  trigger-railway:
    name: Trigger Railway Deploy
    runs-on: ubuntu-latest
    needs: validate-migrations

    steps:
      - name: Trigger Railway Deploy
        run: |
          curl -f -X POST \
            https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation triggerDeploy($projectId: String!, $environmentId: String!, $serviceId: String!) { environmentTriggersDeploy(input: { projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId }) }",
              "variables": {
                "projectId": "${{ secrets.RAILWAY_PROJECT_ID }}",
                "environmentId": "${{ secrets.RAILWAY_ENVIRONMENT_ID }}",
                "serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}"
              }
            }'
