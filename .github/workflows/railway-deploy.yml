name: Railway Deploy Trigger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecotech
          POSTGRES_PASSWORD: ecotech
          POSTGRES_DB: ecotech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations against ephemeral Postgres
        env:
          DATABASE_URL: postgres://ecotech:ecotech@localhost:5432/ecotech_test
        run: pnpm tsx apps/api/scripts/run-migrations.ts

      - name: Check Drizzle schema consistency
        run: pnpm drizzle-kit check --config=drizzle.config.ts
        env:
          DATABASE_URL: postgres://ecotech:ecotech@localhost:5432/ecotech_test
        continue-on-error: true

  trigger-railway:
    name: Trigger Railway Deploy
    runs-on: ubuntu-latest
    needs: validate-migrations

    steps:
      - name: Trigger Railway Deploy
        run: |
          set -euo pipefail

          # Falha cedo se algum secret estiver vazio — senão o curl "passa" e o deploy nunca acontece.
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ] || \
             [ -z "${{ secrets.RAILWAY_PROJECT_ID }}" ] || \
             [ -z "${{ secrets.RAILWAY_ENVIRONMENT_ID }}" ] || \
             [ -z "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            echo "::error::Secrets do Railway ausentes (TOKEN/PROJECT_ID/ENVIRONMENT_ID/SERVICE_ID). Deploy NÃO disparado."
            exit 1
          fi

          # -f não basta: o GraphQL do Railway retorna HTTP 200 mesmo em erro,
          # com o erro dentro do campo "errors". Capturamos o corpo e validamos.
          response=$(curl -sS -X POST \
            https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation triggerDeploy($projectId: String!, $environmentId: String!, $serviceId: String!) { environmentTriggersDeploy(input: { projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId }) }",
              "variables": {
                "projectId": "${{ secrets.RAILWAY_PROJECT_ID }}",
                "environmentId": "${{ secrets.RAILWAY_ENVIRONMENT_ID }}",
                "serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}"
              }
            }')

          echo "Resposta do Railway: $response"

          if echo "$response" | grep -q '"errors"'; then
            echo "::error::Railway retornou erros no GraphQL — deploy NÃO foi disparado de verdade."
            exit 1
          fi

          if ! echo "$response" | grep -q '"environmentTriggersDeploy"'; then
            echo "::error::Resposta inesperada do Railway — deploy não confirmado."
            exit 1
          fi

          echo "Deploy do Railway disparado com sucesso."
