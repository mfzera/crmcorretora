[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["apps/api/**", "libs/**", "package.json", "pnpm-lock.yaml", "Dockerfile"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 100

# IMPORTANT: No Railway Dashboard, configure:
# Root Directory: / (raiz do projeto, não apps/api)
# Build and start commands are now in nixpacks.toml
